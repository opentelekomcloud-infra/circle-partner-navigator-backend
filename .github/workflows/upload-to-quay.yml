name: Build & push backend image + upload SBOM

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  release:
    types: [ published ]
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: opentelekomcloud/circle-partner-navigator-backend

jobs:
  build_push_track:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # if no git tag, publish "latest" from main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # if git tag exists, publish: major, major.minor, full
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Analyze with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          version: "v0.68.2"
          scan-type: image
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          format: cyclonedx
          output: bom.json
          exit-code: 0
          scanners: vuln

      - name: Choose Dependency-Track project version
        id: dt
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ secrets.DEPENDENCYTRACK_PREPROD_HOSTNAME }}
          apiKey: ${{ secrets.DEPENDENCYTRACK_PREPROD_APIKEY }}
          projectName: "${{ env.IMAGE_NAME }}"
          projectVersion: "${{ steps.dt.outputs.version }}"
          bomFilename: "bom.json"
          autoCreate: true
